# yaml-language-server: $schema=../skills/diagramify/references/diagram.schema.json
title: Serverless web API on AWS
subtitle: Single-page app on CloudFront, REST API on API Gateway and Lambda, Cognito sign-in
direction: right
# One port per edge: the dotted authorizer edge must not share the API's arrowhead.
layout: { merge: false }

groups:
  cloud: { type: aws:cloud }
  region: { type: aws:region, label: us-east-1, in: cloud }

nodes:
  users: { icon: aws:users, label: Users }
  cdn: { icon: aws:cloudfront, label: Amazon CloudFront, in: region }
  auth: { icon: aws:cognito, label: Amazon Cognito, note: User pool, in: region }
  site: { icon: aws:s3, label: Web app bucket, note: Static SPA assets, in: region }
  api: { icon: aws:api-gateway, label: Amazon API Gateway, note: REST API, in: region }
  fn: { icon: aws:lambda, label: Orders function, in: region }
  table: { icon: aws:dynamodb, label: Orders table, in: region }
  uploads: { icon: aws:s3, label: Receipts bucket, in: region }

edges:
  - users -> cdn: HTTPS
  - users --> auth: sign in
  - cdn -> site: static files
  - cdn -> api: /api/*
  # Laid out Cognito -> API Gateway so Cognito shares a column with CloudFront.
  - api <.. auth: JWT authorizer
  - api -> fn
  - fn -> table, uploads
