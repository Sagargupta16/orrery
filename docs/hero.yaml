# yaml-language-server: $schema=../skills/stackdraw/references/diagram.schema.json
title: GitOps delivery to three clouds
subtitle: GitHub Actions builds and signs the image, Argo CD syncs GKE, AKS and EKS, Cloudflare fronts all three and Grafana watches them
direction: right

groups:
  github: { type: box, label: GitHub, icon: github:mark-github }
  prod: { type: dashed, label: Production clusters }
  gcloud: { type: gcp:cloud, in: prod }
  azure: { type: azure:subscription, label: Azure subscription, in: prod }
  aws: { type: aws:cloud, in: prod }

nodes:
  dev: { icon: generic:user, label: Developer }
  users: { icon: generic:users, label: Users }
  actions: { icon: logos:github-actions, label: GitHub Actions, note: "Build, test, sign", in: github }
  ghcr: { icon: github:container, label: Container registry, note: ghcr.io, in: github }
  argocd: { icon: logos:argo-icon, label: Argo CD, note: Watches the manifests repo }
  cdn: { icon: logos:cloudflare-icon, label: Cloudflare, note: "DNS, WAF, load balancing" }
  gke: { icon: gcp:gke, label: GKE, in: gcloud }
  aks: { icon: azure:kubernetes-services, label: AKS, in: azure }
  eks: { icon: aws:eks, label: Amazon EKS, in: aws }
  grafana: { icon: logos:grafana, label: Grafana, note: Metrics and logs }

edges:
  - dev -> actions: { label: git push, step: 1 }
  - actions -> ghcr: { label: image, step: 2 }
  - actions -> argocd: { label: new tag, step: 3 }
  # Edges to the boundary, not to each cluster: one flow each, no repeated labels.
  - argocd -> prod: { label: sync, step: 4 }
  - users -> cdn: HTTPS
  - cdn -> prod: traffic
  - prod --> grafana: metrics
