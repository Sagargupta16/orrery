<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="798" height="986" viewBox="0 0 798 986" role="img" aria-labelledby="sequence-oauth-pkce-light-80bc44-sdw-title sequence-oauth-pkce-light-80bc44-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<metadata><orrery:spec xmlns:orrery="https://sagargupta.online/orrery/spec" version="1"># yaml-language-server: $schema=../references/diagram.schema.json
title: OAuth 2.0 authorization code flow with PKCE
subtitle: "RFC 7636: the app proves at the token endpoint that it started the login, so a stolen code is useless"
kind: sequence

# Left to right in the order they first take part: the user's browser starts it.
nodes:
  browser: { icon: generic:browser, label: Browser }
  app: { icon: generic:server, label: Web app, note: OAuth client }
  auth: { icon: generic:auth, label: Authorization server }
  api: { icon: generic:api, label: Resource API }

# Top to bottom is time: calls solid, answers dashed back to the caller.
edges:
  - browser -> app: GET /login
  - app -> app: "new code_verifier, S256 code_challenge"
  - app --> browser: "302 to /authorize (code_challenge, state)"
  - browser -> auth: "GET /authorize (client_id, code_challenge)"
  - auth --> browser: sign-in and consent page
  - browser -> auth: "POST credentials, approve scopes"
  - auth --> browser: "302 to /callback (code, state)"
  - browser -> app: "GET /callback (code, state)"
  - app -> auth: "POST /token (code, code_verifier)"
  - auth -> auth: "SHA-256(code_verifier) = code_challenge?"
  - auth --> app: access and refresh tokens
  - auth --> app: "400 invalid_grant"
  - app -> api: "GET /me (Bearer access token)"
  - api --> app: 200 profile
  - app --> browser: session cookie, home page

# The token endpoint answers one of two ways; only a matching verifier gets tokens.
fragments:
  - type: alt
    label: verifier matches
    from: 11
    to: 12
    else: [{ at: 12, label: no match }]
</orrery:spec></metadata>
<title id="sequence-oauth-pkce-light-80bc44-sdw-title">OAuth 2.0 authorization code flow with PKCE</title>
<desc id="sequence-oauth-pkce-light-80bc44-sdw-desc">OAuth 2.0 authorization code flow with PKCE. Sequence diagram with 4 participants (Browser, Web app, Authorization server, Resource API) and 15 messages. 1. Browser to Web app (GET /login); 2. Web app to itself (new code_verifier, S256 code_challenge); 3. Web app to Browser (302 to /authorize (code_challenge, state)); 4. Browser to Authorization server (GET /authorize (client_id, code_challenge)); 5. Authorization server to Browser (sign-in and consent page); 6. Browser to Authorization server (POST credentials, approve scopes); 7. Authorization server to Browser (302 to /callback (code, state)); 8. Browser to Web app (GET /callback (code, state)); 9. Web app to Authorization server (POST /token (code, code_verifier)); 10. Authorization server to itself (SHA-256(code_verifier) = code_challenge?); 11. Authorization server to Web app (access and refresh tokens); 12. Authorization server to Web app (400 invalid_grant); 13. Web app to Resource API (GET /me (Bearer access token)); 14. Resource API to Web app (200 profile); 15. Web app to Browser (session cookie, home page). Fragments: alt [verifier matches] over messages 11 to 12, else [no match] from 12.</desc>
