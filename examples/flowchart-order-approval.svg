<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="700" height="1222" viewBox="0 0 700 1222" role="img" aria-labelledby="flowchart-order-approval-light-f86bae-sdw-title flowchart-order-approval-light-f86bae-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<metadata><orrery:spec xmlns:orrery="https://sagargupta.online/orrery/spec" version="1"># yaml-language-server: $schema=../references/diagram.schema.json
title: Order approval flowchart
subtitle: An order that fails the credit check must be paid up front; one over the credit limit needs a manager's sign-off
kind: flowchart
layout: { spacing: compact }

# The approved path runs straight down the middle; each decision's other exit leaves sideways
# (align puts a step beside the one it names), so the sign-off sits left and prepayment right.
nodes:
  received: { shape: terminator, label: Order received }
  details: { shape: input, label: Enter order details }
  credit: { shape: predefined, label: Run credit check, note: Credit bureau API }
  credit-ok: { shape: decision, label: Credit OK? }
  call: { shape: manual, label: Ask for prepayment, note: Phone call, align: credit-ok }
  sign-off: { shape: manual, label: Manager signs off, align: limit }
  limit: { shape: decision, label: Over the limit? }
  wait: { shape: delay, label: Wait for payment, note: Up to 48 hours, align: limit }
  reserve: { shape: process, label: Reserve stock }
  paid: { shape: decision, label: Paid in time?, align: reserve }
  invoice: { shape: document, label: Print invoice }
  rejected: { shape: terminator, label: Order rejected, align: invoice }
  approved: { shape: terminator, label: Order approved }

edges:
  - received -> details -> credit -> credit-ok
  - credit-ok -> limit: yes
  - credit-ok -> call: no
  - limit -> sign-off: yes
  - limit -> reserve: no
  - sign-off -> reserve
  - call -> wait -> paid
  - paid -> reserve: yes
  - paid -> rejected: no
  - reserve -> invoice -> approved
</orrery:spec></metadata>
<title id="flowchart-order-approval-light-f86bae-sdw-title">Order approval flowchart</title>
<desc id="flowchart-order-approval-light-f86bae-sdw-desc">Order approval flowchart. 13 components. Connections: Order received to Enter order details; Enter order details to Run credit check; Run credit check to Credit OK?; Credit OK? to Over the limit? (yes); Credit OK? to Ask for prepayment (no); Over the limit? to Manager signs off (yes); Over the limit? to Reserve stock (no); Manager signs off to Reserve stock; Ask for prepayment to Wait for payment; Wait for payment to Paid in time?; Paid in time? to Reserve stock (yes); Paid in time? to Order rejected (no); Reserve stock to Print invoice; Print invoice to Order approved.</desc>
<rect width="700" height="1222" fill="#ffffff"/>
