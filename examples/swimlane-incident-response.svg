<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="755" height="1254" viewBox="0 0 755 1254" role="img" aria-labelledby="swimlane-incident-response-light-9a40c1-sdw-title swimlane-incident-response-light-9a40c1-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<metadata><orrery:spec xmlns:orrery="https://sagargupta.online/orrery/spec" version="1"># yaml-language-server: $schema=../references/diagram.schema.json
title: Incident response
subtitle: Who does what from the first alert to the postmortem, as a cross-functional flowchart
kind: flowchart

groups:
  oncall: { type: lane, label: On-call engineer }
  lead: { type: lane, label: Incident lead }
  comms: { type: lane, label: Communications }

nodes:
  alert: { shape: terminator, label: Alert fires, in: oncall }
  ack: { shape: process, label: Acknowledge the page, in: oncall }
  triage: { shape: process, label: Triage the impact, in: oncall }
  impact: { shape: decision, label: Customers affected?, in: oncall }
  fix: { shape: process, label: Fix and monitor, in: oncall }

  declare: { shape: process, label: Declare an incident, in: lead }
  mitigate: { shape: process, label: Coordinate mitigation, in: lead }
  # align puts a step in the same row as the one it names: the lead's check sits beside the
  # half-hourly updates, and the postmortem is scheduled straight across from the all clear.
  resolved: { shape: decision, label: Resolved?, in: lead, align: update }
  review: { shape: process, label: Schedule the postmortem, in: lead, align: allclear }
  closed: { shape: terminator, label: Incident closed, in: lead }

  status: { shape: process, label: Post a status page update, in: comms }
  update: { shape: process, label: Update every 30 minutes, in: comms }
  allclear: { shape: process, label: Send the all clear, in: comms }

edges:
  - alert -> ack -> triage -> impact
  - impact -> fix: "No"
  - impact -> declare: "Yes"
  - fix -> closed
  - declare -> mitigate -> resolved
  - declare -> status -> update
  - resolved -> mitigate: "No"
  - resolved -> allclear: "Yes"
  - update -> allclear
  - allclear -> review -> closed
</orrery:spec></metadata>
<title id="swimlane-incident-response-light-9a40c1-sdw-title">Incident response</title>
<desc id="swimlane-incident-response-light-9a40c1-sdw-desc">Incident response. 13 components in 3 groups. Connections: Alert fires to Acknowledge the page; Acknowledge the page to Triage the impact; Triage the impact to Customers affected?; Customers affected? to Fix and monitor (No); Customers affected? to Declare an incident (Yes); Fix and monitor to Incident closed; Declare an incident to Coordinate mitigation; Coordinate mitigation to Resolved?; Declare an incident to Post a status page update; Post a status page update to Update every 30 minutes; Resolved? to Coordinate mitigation (No); Resolved? to Send the all clear (Yes); Update every 30 minutes to Send the all clear; Send the all clear to Schedule the postmortem; Schedule the postmortem to Incident closed.</desc>
