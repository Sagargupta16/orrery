<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="755" height="548" viewBox="0 0 755 548" role="img" aria-labelledby="tree-org-chart-light-1d4821-sdw-title tree-org-chart-light-1d4821-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<metadata><orrery:spec xmlns:orrery="https://sagargupta.online/orrery/spec" version="1"># yaml-language-server: $schema=../references/diagram.schema.json
title: Product organization
subtitle: Three levels, from the chief product officer to the teams, as an org chart
kind: tree

# Icons with the label under them are narrower than cards, so the seven teams fit one row at full
# size; each unit gets an icon of its own.
nodes:
  cpo: { icon: generic:manager, label: Chief Product Officer, note: Strategy and roadmap }
  design: { icon: tabler:palette, label: Design, note: 9 people }
  engineering: { icon: generic:code, label: Engineering, note: 24 people }
  pm: { icon: tabler:compass, label: Product management, note: 7 people }
  research: { icon: generic:search, label: User research }
  brand: { icon: tabler:brush, label: Brand and UI }
  platform: { icon: generic:server, label: Platform }
  web: { icon: generic:browser, label: Web app }
  mobile: { icon: generic:mobile, label: Mobile apps }
  growth: { icon: generic:metrics, label: Growth }
  payments: { icon: generic:payment, label: Payments }

edges:
  - cpo -> design, engineering, pm
  - design -> research, brand
  - engineering -> platform, web, mobile
  - pm -> growth, payments
</orrery:spec></metadata>
<title id="tree-org-chart-light-1d4821-sdw-title">Product organization</title>
<desc id="tree-org-chart-light-1d4821-sdw-desc">Product organization. 11 components. Connections: Chief Product Officer to Design; Chief Product Officer to Engineering; Chief Product Officer to Product management; Design to User research; Design to Brand and UI; Engineering to Platform; Engineering to Web app; Engineering to Mobile apps; Product management to Growth; Product management to Payments.</desc>
