<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="598" viewBox="0 0 880 598" role="img" aria-labelledby="timeline-cloud-migration-light-cd876a-sdw-title timeline-cloud-migration-light-cd876a-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<metadata><orrery:spec xmlns:orrery="https://sagargupta.online/orrery/spec" version="1"># yaml-language-server: $schema=../references/diagram.schema.json
title: Data center migration plan
subtitle: Ten months from discovery to the last rack, month by month and wave by wave
kind: timeline
timeline: { scale: month, start: 2026-01, end: 2026-10, today: 2026-04-14 }

# The dates everyone steers by sit in the first row; each workstream is a lane under it.
groups:
  plan: { label: Plan }
  move: { label: Migrate }
  run: { label: Operate }

nodes:
  gate: { label: Go or no-go, date: 2026-04-30, milestone: true, status: planned }
  cutover: { label: Cutover, date: 2026-09-12, milestone: true, status: planned }

  discovery: { in: plan, icon: generic:search, label: Discovery, start: 2026-01-05, end: 2026-02-27, status: done }
  landing: { in: plan, label: Landing zone, start: 2026-02-09, end: 2026-03-31, status: done }

  pilot: { in: move, label: Pilot, note: 12 apps, start: 2026-04-01, end: 2026-04-30, status: active }
  wave1: { in: move, label: Wave 1, note: 140 apps, start: 2026-05-04, end: 2026-06-12, status: planned }
  wave2: { in: move, label: Wave 2, note: Databases, start: 2026-06-15, end: 2026-07-31, status: at-risk }
  wave3: { in: move, label: Wave 3, note: 60 apps, start: 2026-08-03, end: 2026-09-11, status: planned }

  runbooks: { in: run, icon: generic:file, label: Runbooks and on-call, start: 2026-04, end: 2026-06, status: active }
  exit: { in: run, label: Shutdown, note: 38 racks, start: 2026-09-14, end: 2026-10-30, status: planned }

# Finish to start: the pilot waits for the inventory and the landing zone, each wave for the one
# before it, the cutover for the last wave.
edges:
  - discovery -> pilot
  - landing -> pilot -> gate
  - gate -> wave1 -> wave2 -> wave3 -> cutover -> exit
</orrery:spec></metadata>
<title id="timeline-cloud-migration-light-cd876a-sdw-title">Data center migration plan</title>
<desc id="timeline-cloud-migration-light-cd876a-sdw-desc">Data center migration plan. Timeline by month from Jan 2026 to Oct 2026, 10 items in 4 lanes (Milestones, Plan, Migrate, Operate). Items: Go or no-go (Apr 30 2026, planned, milestone); Cutover (Sep 12 2026, planned, milestone); Discovery (Jan 5 2026 to Feb 27 2026, done); Landing zone (Feb 9 2026 to Mar 31 2026, done); Pilot (Apr 1 2026 to Apr 30 2026, in progress); Wave 1 (May 4 2026 to Jun 12 2026, planned); Wave 2 (Jun 15 2026 to Jul 31 2026, at risk); Wave 3 (Aug 3 2026 to Sep 11 2026, planned); Runbooks and on-call (Apr 1 2026 to Jun 30 2026, in progress); Shutdown (Sep 14 2026 to Oct 30 2026, planned). Today is Apr 14 2026. Dependencies: Discovery before Pilot; Landing zone before Pilot; Pilot before Go or no-go; Go or no-go before Wave 1; Wave 1 before Wave 2; Wave 2 before Wave 3; Wave 3 before Cutover; Cutover before Shutdown.</desc>
