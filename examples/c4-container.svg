<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="664" height="1063" viewBox="0 0 664 1063" role="img" aria-labelledby="dfy-title dfy-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<title id="dfy-title">Container diagram for an online store</title>
<desc id="dfy-desc">Container diagram for an online store. 8 components in 1 groups. Connections: Customer to Web application (Uses [HTTPS]); Support staff to Back office (Uses [HTTPS]); Web application to API application (Calls [JSON, HTTPS]); Back office to API application (Calls [JSON, HTTPS]); API application to Database (Reads and writes [SQL]); API application to Payment provider (Charges cards [HTTPS]); API application to Email service (Sends receipts [SMTP]).</desc>
<rect width="664" height="1063" fill="#ffffff"/>
<text font-size="20" font-weight="600" fill="#232f3e"><tspan x="28" y="43.78">Container diagram for an online store</tspan></text>
<text font-size="13" fill="#5f6b7a"><tspan x="28" y="66.18">C4 model, level 2: the containers inside the system, and the people and external systems around it</tspan></text>
