<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="1360" viewBox="0 0 720 1360" role="img" aria-labelledby="c4-container-light-sdw-title c4-container-light-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<title id="c4-container-light-sdw-title">Container diagram for an online store</title>
<desc id="c4-container-light-sdw-desc">Container diagram for an online store. 8 components in 1 groups. Connections: Customer to Web application (Browses and buys products using [HTTPS]); Support staff to Back office (Manages orders using [HTTPS]); Web application to API application (Makes API calls to [JSON/HTTPS]); Back office to API application (Makes API calls to [JSON/HTTPS]); API application to Database (Reads and writes [SQL]); API application to Payment provider (Charges cards and issues refunds [HTTPS]); API application to Email service (Sends e-mail using [SMTP]); Customer to Email service (Sends receipts to [SMTP]).</desc>
<rect width="720" height="1360" fill="#ffffff"/>
<text font-size="20" font-weight="600" fill="#232f3e"><tspan x="28" y="43.78">Container diagram for an online store</tspan></text>
<text font-size="13" fill="#5f6b7a"><tspan x="28" y="66.18">C4 model, level 2: the containers inside the system, and the people and external systems around it</tspan></text>
