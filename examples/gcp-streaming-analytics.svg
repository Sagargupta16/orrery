<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1525" height="602" viewBox="0 0 1525 602" role="img" aria-labelledby="dfy-title dfy-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<title id="dfy-title">Streaming analytics on Google Cloud</title>
<desc id="dfy-desc">Streaming analytics on Google Cloud. 8 components in 3 groups. Connections: Store devices to Pub/Sub (publish); Web and mobile apps to Pub/Sub (publish); Pub/Sub to Dataflow (subscribe); Dataflow to BigQuery (streaming writes); Dataflow to Cloud Storage (raw files); Dataflow to Vertex AI (online prediction); BigQuery to Looker (SQL); BigQuery to Vertex AI (training data).</desc>
<rect width="1525" height="602" fill="#ffffff"/>
<text font-size="20" font-weight="600" fill="#232f3e"><tspan x="28" y="43.78">Streaming analytics on Google Cloud</tspan></text>
<text font-size="13" fill="#5f6b7a"><tspan x="28" y="66.18">Events flow through Pub/Sub and Dataflow into BigQuery for Looker dashboards and Vertex AI models</tspan></text>
