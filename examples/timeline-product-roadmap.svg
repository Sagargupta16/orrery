<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="598" viewBox="0 0 880 598" role="img" aria-labelledby="timeline-product-roadmap-light-bffbec-sdw-title timeline-product-roadmap-light-bffbec-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<metadata><orrery:spec xmlns:orrery="https://sagargupta.online/orrery/spec" version="1"># yaml-language-server: $schema=../references/diagram.schema.json
title: Product roadmap 2026
subtitle: Three workstreams by quarter, what has shipped, what is in flight and what waits on what
kind: timeline
timeline: { scale: quarter, start: 2026-Q1, end: 2026-Q4, today: 2026-05-18 }

# Each group is a lane. start and end draw a bar, date a point, milestone: true a diamond; the
# status sets the style and the key under the lanes says what each style means.
groups:
  platform: { label: Platform }
  product: { label: Product }
  growth: { label: Growth }

nodes:
  # Items in no group share the first row: the dates the whole company works to.
  beta: { label: Public beta, date: 2026-03-16, milestone: true, status: done }
  ga: { label: General availability, date: 2026-09-30, milestone: true, status: planned }

  api: { in: platform, label: API v2, start: 2026-01, end: 2026-03, status: done }
  billing: { in: platform, label: Usage billing, start: 2026-04, end: 2026-07, status: active }
  sso: { in: platform, label: SSO and SCIM, start: 2026-06, end: 2026-09, status: planned }
  eu: { in: platform, label: EU region, start: 2026-10, end: 2026-12, status: at-risk }

  editor: { in: product, label: New editor, start: 2026-01, end: 2026-04, status: done }
  mobile: { in: product, label: Mobile app, start: 2026-05, end: 2026-09, status: active }
  offline: { in: product, label: Offline mode, start: 2026-10, end: 2026-12, status: planned }

  pricing: { in: growth, label: Pricing page, start: 2026-02, end: 2026-03, status: done }
  trials: { in: growth, label: Self-serve trials, start: 2026-04, end: 2026-06, status: active }
  partners: { in: growth, label: Partner program, start: 2026-08, end: 2026-11, status: planned }

# Dependencies are finish to start: the arrow leaves the end of one item for the start of the next.
edges:
  - api -> billing
  - editor -> mobile
  - pricing -> trials -> partners
  - sso -> ga
</orrery:spec></metadata>
<title id="timeline-product-roadmap-light-bffbec-sdw-title">Product roadmap 2026</title>
<desc id="timeline-product-roadmap-light-bffbec-sdw-desc">Product roadmap 2026. Timeline by quarter from Q1 2026 to Q4 2026, 12 items in 4 lanes (Milestones, Platform, Product, Growth). Items: Public beta (Mar 16 2026, done, milestone); General availability (Sep 30 2026, planned, milestone); API v2 (Jan 1 2026 to Mar 31 2026, done); Usage billing (Apr 1 2026 to Jul 31 2026, in progress); SSO and SCIM (Jun 1 2026 to Sep 30 2026, planned); EU region (Oct 1 2026 to Dec 31 2026, at risk); New editor (Jan 1 2026 to Apr 30 2026, done); Mobile app (May 1 2026 to Sep 30 2026, in progress); Offline mode (Oct 1 2026 to Dec 31 2026, planned); Pricing page (Feb 1 2026 to Mar 31 2026, done); Self-serve trials (Apr 1 2026 to Jun 30 2026, in progress); Partner program (Aug 1 2026 to Nov 30 2026, planned). Today is May 18 2026. Dependencies: API v2 before Usage billing; New editor before Mobile app; Pricing page before Self-serve trials; Self-serve trials before Partner program; SSO and SCIM before General availability.</desc>
