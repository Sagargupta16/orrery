<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="730" height="1129" viewBox="0 0 730 1129" role="img" aria-labelledby="state-order-lifecycle-light-b9775d-sdw-title state-order-lifecycle-light-b9775d-sdw-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<metadata><orrery:spec xmlns:orrery="https://sagargupta.online/orrery/spec" version="1"># yaml-language-server: $schema=../references/diagram.schema.json
title: Order lifecycle
subtitle: "UML state machine: transitions read event [guard] / action"
kind: state
# Top to bottom: left to right, seven states with long transition labels make a strip.
direction: down
# One port per transition, as UML draws them; a self-transition then keeps the top of its state.
layout: { merge: false, spacing: 0.9 }

# The happy path runs down the left; align sets each way out beside the state it leaves, so the
# cancelled order turns right at Created and a refund sits beside Delivered.
nodes:
  start: { shape: initial }
  created: { shape: state, label: Created }
  paid: { shape: state, label: Paid }
  packed: { shape: state, label: Packed }
  shipped: { shape: state, label: Shipped }
  delivered: { shape: state, label: Delivered }
  cancelled: { shape: state, label: Cancelled, align: created }
  refunded: { shape: state, label: Refunded, align: delivered }
  end: { shape: final }
  closed: { shape: final, align: cancelled }

edges:
  - start -> created
  - created -> paid: "pay [card ok] / charge"
  - created -> created: "edit / recalc total"
  - created -> cancelled: "cancel / release stock"
  - paid -> packed: "pick / print label"
  - paid -> refunded: "cancel [not packed] / refund"
  - packed -> shipped: "hand over / send tracking"
  - shipped -> delivered: "deliver / notify buyer"
  - delivered -> refunded: "return [within 30 days] / refund"
  - delivered -> end
  - cancelled -> closed
  - refunded -> end
</orrery:spec></metadata>
<title id="state-order-lifecycle-light-b9775d-sdw-title">Order lifecycle</title>
<desc id="state-order-lifecycle-light-b9775d-sdw-desc">Order lifecycle. 10 components. Connections: to Created; Created to Paid (pay [card ok] / charge); Created to Created (edit / recalc total); Created to Cancelled (cancel / release stock); Paid to Packed (pick / print label); Paid to Refunded (cancel [not packed] / refund); Packed to Shipped (hand over / send tracking); Shipped to Delivered (deliver / notify buyer); Delivered to Refunded (return [within 30 days] / refund); Delivered to ; Cancelled to ; Refunded to .</desc>
