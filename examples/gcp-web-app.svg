<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1792" height="523" viewBox="0 0 1792 523" role="img" aria-labelledby="dfy-title dfy-desc" font-family="Inter, &#39;Segoe UI&#39;, -apple-system, BlinkMacSystemFont, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<title id="dfy-title">Web application on Google Cloud</title>
<desc id="dfy-desc">Web application on Google Cloud. 8 components in 3 groups. Connections: Users to Cloud Load Balancing (HTTPS); Cloud Armor to Cloud Load Balancing; Cloud CDN to Cloud Load Balancing; Cloud Load Balancing to Cloud Run; Cloud Run to Cloud SQL; Cloud Run to Memorystore; Cloud Run to Secret Manager.</desc>
<rect width="1792" height="523" fill="#ffffff"/>
<text font-size="20" font-weight="600" fill="#232f3e"><tspan x="28" y="43.78">Web application on Google Cloud</tspan></text>
<text font-size="13" fill="#5f6b7a"><tspan x="28" y="66.18">A global load balancer with Cloud CDN and Cloud Armor in front of Cloud Run, backed by Cloud SQL and Memorystore</tspan></text>
