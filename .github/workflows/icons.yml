name: Refresh icons and build output

# Runs on every Renovate branch, so the one monthly dependency pull request (the shared preset in
# renovate.json groups every update on the 1st) also carries what is generated from those
# dependencies: the newest official AWS, Azure, Google Cloud and Kubernetes packs re-pinned, the
# icon catalogs with the library pins and the counts the docs quote, the bundled CLI and vendored
# engines, and the gallery. Renovate cannot run build scripts, so without this its pull requests
# fail `build.mjs --check` or the checksum test and never auto-merge.
#
# A push made with GITHUB_TOKEN starts no workflow run, so this job dispatches ci.yml on the branch
# itself; those check runs land on the new head, which is what Renovate's automerge waits for.
# renovate.json lists github-actions[bot] in gitIgnoredAuthors, so Renovate keeps managing (and
# rebasing) a branch this job committed to. For an off-cycle refresh, run it on any branch but main.
on:
  push:
    branches: ["renovate/**"]
  workflow_dispatch:

# Nothing by default; the job asks for exactly what it writes.
permissions: {}

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the regenerated files to the branch
      actions: write # dispatch ci.yml on the branch
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exits 1 when an alias in scripts/icon-aliases.json points nowhere or hides a real icon,
      # so a vendor rename fails this run loudly and the pull request stays red.
      - name: Fetch the newest official packs, rebuild the catalogs and the counts in the docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-icons.mjs --latest

      - name: Rebuild the bundled CLI
        run: node scripts/build.mjs

      - name: Re-render the gallery
        run: node scripts/gallery.mjs

      - name: Commit and push
        id: push
        run: |
          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md THIRD_PARTY_NOTICES.md docs examples scripts/icon-sources.json skills
          git commit -m "chore: refresh icons and build output"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Start the checks on the new head
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
