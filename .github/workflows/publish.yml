name: Publish

# A published GitHub release ships the version everywhere that installs from a release:
# - Gemini CLI installs an extension from the latest release's archive when there is one. The
#   archive leaves out agents/, which is in Claude Code's format and which Gemini rejects with an
#   error per file; the skill is all Gemini needs.
# - npm gets the CLI as @sagargupta1610/orrery, staged from the skill folder by
#   scripts/pack-npm.mjs. A version already on npm (the first one is published by hand, before
#   trusted publishing can be configured) is skipped.
# - The MCP Bundle out/orrery-<version>.mcpb (one-click install in Claude Desktop) is attached to
#   the release, built by scripts/pack-mcpb.mjs.
# - The MCP Registry gets out/server.json, server.json plus the bundle as a second package, after
#   npm has the version (the registry checks the package's mcpName). A version already listed is
#   skipped.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the Gemini CLI archive and the MCP Bundle to the release
      id-token: write # npm trusted publishing (OIDC) + provenance, MCP Registry login (OIDC)
    steps:
      # Nothing here pushes (gh uploads with GH_TOKEN), so the token is not left on disk for the
      # steps that follow, one of which runs a downloaded binary.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/build.mjs --check
      - run: node scripts/check-repo.mjs
      - name: Check version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) != release tag ($TAG)" >&2
            exit 1
          fi

      - name: Attach the Gemini CLI extension archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/gemini
          cp -r gemini-extension.json skills README.md LICENSE THIRD_PARTY_NOTICES.md out/gemini/
          tar -czf out/orrery.tar.gz -C out/gemini .
          gh release upload "$GITHUB_REF_NAME" out/orrery.tar.gz --clobber

      - run: node scripts/pack-npm.mjs
      # No token: authenticated via OIDC trusted publishing configured on npmjs.com
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@sagargupta1610/orrery@$VERSION" version >/dev/null 2>&1; then
            echo "@sagargupta1610/orrery@$VERSION is already on npm"
          else
            # ./ makes it a folder: npm reads a bare out/npm as the GitHub repository out/npm.
            npm publish ./out/npm --access public
          fi

      - run: node scripts/pack-mcpb.mjs
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate out/mcpb/manifest.json
      - name: Attach the MCP Bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "out/orrery-${GITHUB_REF_NAME#v}.mcpb" --clobber

      # No token: mcp-publisher logs in with this job's GitHub OIDC token, which grants the
      # io.github.Sagargupta16/* namespace. The registry refuses to list a version twice.
      # This job can also publish to npm, so the publisher is a pinned release checked against its
      # sha256 (the line for it in that release's registry_<version>_checksums.txt); bump both
      # together, on purpose, never back to releases/latest.
      - name: Publish to the MCP Registry
        env:
          PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.5/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: 2d151ac57275c9a6684d9d22b1cba81058bab195ea0a162e8fce3c6a5ec32812
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LISTED="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Sagargupta16%2Forrery/versions/$VERSION"
          if curl -fs -o /dev/null "$LISTED"; then
            echo "io.github.Sagargupta16/orrery $VERSION is already in the MCP Registry"
          else
            curl -fsSL -o mcp-publisher.tar.gz "$PUBLISHER"
            echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
            tar xzf mcp-publisher.tar.gz mcp-publisher
            ./mcp-publisher login github-oidc
            # The registry reads the version back from npm, which can take a minute to show a
            # package published a moment ago; try again until it does.
            for attempt in 1 2 3 4 5 6; do
              ./mcp-publisher publish out/server.json && exit 0
              echo "attempt $attempt failed; waiting for npm to list $VERSION"
              sleep 30
            done
            exit 1
          fi
