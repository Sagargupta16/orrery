# yaml-language-server: $schema=../references/diagram.schema.json
title: Open-source data platform
subtitle: Debezium and Airbyte feed Kafka, Flink lands the streams as Iceberg tables on MinIO, and dbt models them on Trino for Superset on an Airflow schedule
direction: right
layout: { layering: simplex }

groups:
  # Listed first so the Transform zone sits under Store and Serve stays on the main row.
  transform: { type: zone, label: Transform }
  sources: { type: zone, label: Sources }
  ingest: { type: zone, label: Ingest }
  store: { type: zone, label: Store }
  minio: { type: box, label: MinIO, icon: si:minio, in: store }
  serve: { type: zone, label: Serve }

nodes:
  # Airflow stays outside the zones so Transform is one column wide, like Store above it.
  airflow: { icon: logos:airflow-icon, label: Apache Airflow, note: Orchestration }
  dbt: { icon: logos:dbt-icon, label: dbt, note: SQL models on Trino, in: transform }
  saas: { icon: generic:api, label: SaaS APIs, note: CRM and billing, in: sources }
  postgres: { icon: logos:postgresql, label: PostgreSQL, note: Orders, in: sources }
  mysql: { icon: logos:mysql-icon, label: MySQL, note: Inventory, in: sources }
  airbyte: { icon: si:airbyte, label: Airbyte, note: API syncs, in: ingest }
  # No Debezium mark in the packs: a neutral glyph with the product name.
  debezium: { icon: tabler:database-export, label: Debezium, note: Change data capture, in: ingest }
  kafka: { icon: logos:kafka-icon, label: Apache Kafka, note: Event streams, in: ingest }
  flink: { icon: logos:apache-flink-icon, label: Apache Flink, note: Stream processing, in: ingest }
  iceberg: { icon: tabler:iceberg, label: Apache Iceberg, note: Lakehouse tables, in: minio }
  trino: { icon: si:trino, label: Trino, note: Query engine, in: serve }
  superset: { icon: logos:apache-superset-icon, label: Apache Superset, note: Dashboards, in: serve }

edges:
  - saas -> airbyte -> kafka
  - postgres -> debezium: WAL
  - mysql -> debezium: binlog
  - debezium -> kafka
  - kafka -> flink
  - flink -> iceberg
  - iceberg -> trino
  - airflow --> dbt
  - dbt -> trino
  - trino -> superset
