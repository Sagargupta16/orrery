# yaml-language-server: $schema=../references/diagram.schema.json
title: URL shortener system design
subtitle: Redirects are served from the CDN and a Redis cache in front of PostgreSQL; every click streams through Kafka into an analytics pipeline
direction: right

groups:
  analytics: { type: zone, label: Click analytics pipeline }

nodes:
  clients: { icon: generic:users, label: Clients, note: Browsers and apps }
  cdn: { icon: generic:cdn, label: CDN, note: Caches popular redirects }
  lb: { icon: generic:load-balancer, label: Load balancer }
  api: { icon: generic:servers, label: API servers, note: Stateless, badge: x3 }
  cache: { icon: logos:redis, label: Redis, note: Hot short codes }
  db: { icon: logos:postgresql, label: PostgreSQL, note: Sharded by short code }
  ids: { icon: tabler:hash, label: ID generator, note: Base62 key ranges }
  events: { icon: logos:kafka-icon, label: Kafka, note: clicks topic, in: analytics }
  stream: { icon: logos:apache-flink-icon, label: Apache Flink, note: Counts per link, in: analytics }
  olap: { icon: si:clickhouse, label: ClickHouse, note: Click analytics, in: analytics }
  dashboard: { icon: generic:dashboard, label: Dashboards, in: analytics }

edges:
  - clients -> cdn: GET /abc123
  - cdn -> lb: cache miss
  - lb -> api
  # Every edge out of the API is labelled, so its targets share one column.
  - api -> cache: lookup
  - api -> db: on miss
  - api -> ids: new link
  - api --> events: click event
  - events -> stream -> olap -> dashboard
