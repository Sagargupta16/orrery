# yaml-language-server: $schema=../references/diagram.schema.json
title: Hybrid network on AWS
subtitle: A corporate data center reaches VPCs in three accounts through one Transit Gateway, over Direct Connect with Site-to-Site VPN as backup
direction: right
# Own ports per link: the dashed VPN backup must not share a trunk with Direct Connect.
layout: { merge: false }

groups:
  dc: { type: aws:corporate-dc, label: Corporate data center }
  cloud: { type: aws:cloud }
  region: { type: aws:region, label: us-east-1, in: cloud }
  network: { type: aws:account, label: Network account, in: region }
  prod: { type: aws:account, label: Production account, in: region }
  prod-vpc: { type: aws:vpc, label: Production VPC 10.1.0.0/16, in: prod }
  dev: { type: aws:account, label: Development account, in: region }
  dev-vpc: { type: aws:vpc, label: Development VPC 10.2.0.0/16, in: dev }
  shared: { type: aws:account, label: Shared services account, in: region }
  shared-vpc: { type: aws:vpc, label: Shared services VPC 10.3.0.0/16, in: shared }

nodes:
  servers: { icon: aws:servers, label: Application servers, in: dc }
  router: { icon: aws:vpc-customer-gateway, label: Customer gateway, note: BGP ASN 65000, in: dc }
  dx: { icon: aws:direct-connect, label: AWS Direct Connect, note: 10 Gbps primary link }
  vpn: { icon: aws:site-to-site-vpn, label: AWS Site-to-Site VPN, note: IPsec backup link }
  dxgw: { icon: aws:direct-connect-gateway, label: Direct Connect gateway, in: network }
  tgw: { icon: aws:tgw, label: AWS Transit Gateway, in: network }
  prod-att: { icon: aws:transit-gateway-attachment, label: TGW attachment, in: prod-vpc }
  prod-app: { icon: aws:eks, label: Amazon EKS, note: Production workloads, in: prod-vpc }
  dev-att: { icon: aws:transit-gateway-attachment, label: TGW attachment, in: dev-vpc }
  dev-app: { icon: aws:ec2, label: Amazon EC2, note: Development hosts, in: dev-vpc }
  shared-att: { icon: aws:transit-gateway-attachment, label: TGW attachment, in: shared-vpc }
  dns: { icon: aws:route-53-resolver, label: Route 53 Resolver, note: Hybrid DNS endpoints, in: shared-vpc }

# Network links carry traffic both ways, so they are drawn without arrowheads.
edges:
  - servers -- router
  - router === dx
  - dx === dxgw
  - dxgw === tgw
  - router --- vpn
  - vpn --- tgw
  - tgw -- prod-att -- prod-app
  - tgw -- dev-att -- dev-app
  - tgw -- shared-att -- dns
