# yaml-language-server: $schema=../references/diagram.schema.json
title: Web application on Google Cloud
subtitle: A global load balancer with Cloud CDN and Cloud Armor in front of Cloud Run, backed by Cloud SQL and Memorystore
direction: right
# Product cards, as in Google Cloud's own architecture diagrams; one port per edge.
look: card
layout: { merge: false }

groups:
  gcloud: { type: gcp:cloud }
  project: { type: gcp:project, label: Project web-prod, in: gcloud }
  region: { type: gcp:region, label: us-central1, in: project }

nodes:
  users: { icon: generic:users, label: Users, note: Browsers and mobile apps }
  lb: { icon: gcp:cloud-load-balancing, label: Cloud Load Balancing, note: Global external HTTPS, in: project }
  armor: { icon: gcp:cloud-armor, label: Cloud Armor, note: WAF security policy, in: project }
  cdn: { icon: gcp:cloud-cdn, label: Cloud CDN, note: Caches static assets, in: project }
  run: { icon: gcp:cloud-run, label: Cloud Run, note: web service, in: region }
  sql: { icon: gcp:cloud-sql, label: Cloud SQL, note: PostgreSQL with HA, in: region }
  redis: { icon: gcp:memorystore, label: Memorystore, note: Redis session store, in: region }
  secrets: { icon: gcp:secret-manager, label: Secret Manager, note: Database credentials, in: project }

edges:
  - users -> lb: HTTPS
  # Cloud Armor and Cloud CDN attach to the load balancer: plain lines, not hops of their own.
  - armor, cdn -- lb
  - lb -> run
  - run -> sql, redis, secrets
