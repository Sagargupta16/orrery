# yaml-language-server: $schema=../references/diagram.schema.json
title: Data center migration plan
subtitle: Nine months from discovery to the last rack, month by month, wave by wave
kind: timeline
timeline: { scale: month, start: 2026-01, end: 2026-09, today: 2026-04-14 }

# The dates people steer by sit in the first row; each workstream is a lane under it.
groups:
  plan: { label: Plan }
  move: { label: Migrate }
  run: { label: Operate }

nodes:
  gate: { label: Go or no-go, date: 2026-04-30, milestone: true, status: planned }
  cutover: { label: Cutover, date: 2026-08-22, milestone: true, status: planned }

  discovery: { in: plan, icon: generic:search, label: Discovery, note: 412 servers mapped, start: 2026-01, end: 2026-02, status: done }
  landing: { in: plan, icon: generic:cloud, label: Landing zone, start: 2026-02-16, end: 2026-03-31, status: done }

  pilot: { in: move, label: Pilot, note: 12 apps, start: 2026-03-16, end: 2026-04-30, status: active }
  wave1: { in: move, label: Wave 1, note: 140 apps, start: 2026-05, end: 2026-06-15, status: planned }
  wave2: { in: move, label: Wave 2, note: Databases, start: 2026-06-16, end: 2026-07-31, status: at-risk }
  wave3: { in: move, label: Wave 3, start: 2026-08-01, end: 2026-08-21, status: planned }

  runbooks: { in: run, icon: generic:file, label: Runbooks and on-call, start: 2026-04, end: 2026-06, status: active }
  exit: { in: run, icon: generic:server, label: Rack decommission, start: 2026-08-24, end: 2026-09-30, status: planned }

# Each wave starts when the one before it is done; the cutover waits for the last wave.
edges:
  - discovery -> landing -> pilot -> gate
  - gate -> wave1 -> wave2 -> wave3 -> cutover -> exit
