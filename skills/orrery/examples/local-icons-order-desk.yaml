# yaml-language-server: $schema=../references/diagram.schema.json
title: Order desk
subtitle: From order to delivered and paid; three steps use the team's own icons
kind: flowchart
look: card
layout: { spacing: compact }
# The team's own drawings, made to the rules in references/icons.md and passed by `orrery icons check`.
icons:
  order-desk: ./icons/order-desk.svg
  credit-check: ./icons/credit-check.svg
  pick-pack: ./icons/pick-pack.svg

nodes:
  # The entry and the three exits are terminators that carry their icons.
  customer: { shape: terminator, icon: generic:customer, label: Customer orders }
  desk: { icon: local:order-desk, label: Order desk, note: "Phone, mail or web" }
  credit: { icon: local:credit-check, label: Credit check }
  limit: { shape: decision, label: Within limit? }
  # The no branch leaves the decision sideways, as flowcharts draw it; yes carries straight on.
  manager: { icon: generic:manager, label: Sales manager, align: limit }
  declined: { shape: terminator, icon: generic:failure, label: Order declined }
  pick: { icon: local:pick-pack, label: Pick and pack, note: Warehouse bench }
  courier: { icon: generic:delivery, label: Courier }
  delivered: { shape: terminator, icon: generic:success, label: Delivered }
  invoice: { icon: generic:invoice, label: Invoice, note: Net 30 }
  paid: { shape: terminator, icon: generic:cash, label: Paid }

edges:
  - customer -> desk
  - desk -> credit -> limit
  - limit -> pick: yes
  - limit -> manager: no
  - manager -> pick: signs off
  - manager -> declined: declines
  # The warehouse and accounts work in parallel once the order is approved.
  - pick -> courier -> delivered
  - pick -> invoice -> paid
