# yaml-language-server: $schema=../references/diagram.schema.json
title: Data lake on AWS
subtitle: Streaming and database sources land in S3; Glue refines them zone by zone for Athena, Redshift and QuickSight
direction: right
# simplex keeps Lake Formation next to the catalog instead of in the first column; merge: false
# keeps the dotted catalog edges apart from the solid data edges into Athena and Redshift.
layout: { layering: simplex, merge: false }

groups:
  sources: { type: zone, label: Sources }
  cloud: { type: aws:cloud }
  region: { type: aws:region, label: us-east-1, in: cloud }
  raw-zone: { type: zone, label: Raw zone, in: region }
  curated-zone: { type: zone, label: Curated zone, in: region }
  analytics-zone: { type: zone, label: Analytics zone, in: region }
  governance: { type: zone, label: Catalog and governance, in: region }

nodes:
  apps: { icon: aws:mobile-client, label: Web and mobile apps, in: sources }
  ordersdb: { icon: logos:postgresql, label: Orders database, note: PostgreSQL, in: sources }
  firehose: { icon: aws:firehose, label: Amazon Data Firehose, in: region }
  dms: { icon: aws:dms, label: AWS DMS, note: Change data capture, in: region }
  raw: { icon: aws:s3, label: Raw bucket, note: JSON and CSV, in: raw-zone }
  clean: { icon: aws:glue, label: Clean and convert, note: AWS Glue job, in: curated-zone }
  curated: { icon: aws:s3, label: Curated bucket, note: Parquet, in: curated-zone }
  aggregate: { icon: aws:glue, label: Aggregate, note: AWS Glue job, in: analytics-zone }
  analytics: { icon: aws:s3, label: Analytics bucket, note: Iceberg tables, in: analytics-zone }
  crawler: { icon: aws:glue-crawler, label: Glue crawlers, note: Scan every zone, in: governance }
  lf: { icon: aws:lake-formation, label: AWS Lake Formation, note: Permissions, in: governance }
  catalog: { icon: aws:glue-data-catalog, label: Glue Data Catalog, in: governance }
  athena: { icon: aws:athena, label: Amazon Athena, in: region }
  redshift: { icon: aws:redshift, label: Amazon Redshift, in: region }
  quicksight: { icon: aws:quicksight, label: Amazon QuickSight, in: region }

edges:
  - apps -> firehose -> raw
  - ordersdb -> dms -> raw
  - raw -> clean -> curated -> aggregate -> analytics
  - analytics -> athena, redshift
  - athena, redshift -> quicksight
  # Metadata and permissions are dotted.
  - crawler, lf ..> catalog
  - catalog ..> athena
