# yaml-language-server: $schema=../references/diagram.schema.json
title: Hub-spoke network on Azure
subtitle: On-premises reaches two peered spoke networks through the hub's gateways and Azure Firewall, over ExpressRoute with a VPN backup
direction: right
# Filled triangles, as in Azure's reference diagrams. One port per edge: the peering and diagnostics
# lines all leave the hub's border and need their own lanes.
arrowhead: filled
layout: { merge: false, spacing: compact }

groups:
  onprem: { type: azure:on-prem, label: On-premises datacenter }
  sub: { type: azure:subscription, label: Production subscription }
  hub: { type: azure:vnet-hub, label: vnet-hub 10.0.0.0/16, in: sub }
  snet-gw: { type: azure:subnet, label: GatewaySubnet, in: hub }
  snet-fw: { type: azure:subnet, label: AzureFirewallSubnet, in: hub }
  snet-bastion: { type: azure:subnet, label: AzureBastionSubnet, in: hub }
  spoke-app: { type: azure:vnet-hub, label: vnet-spoke-app 10.1.0.0/16, in: sub }
  snet-aks: { type: azure:subnet, label: snet-aks, in: spoke-app }
  spoke-data: { type: azure:vnet-hub, label: vnet-spoke-data 10.2.0.0/16, in: sub }
  snet-vm: { type: azure:subnet, label: snet-vm, in: spoke-data }
  snet-pe: { type: azure:subnet, label: snet-private-endpoints, in: spoke-data }

nodes:
  servers: { icon: generic:servers, label: Corporate servers, in: onprem }
  router: { icon: generic:router, label: Edge router, note: BGP ASN 65010, in: onprem }
  er: { icon: azure:expressroute, label: ExpressRoute circuit, note: 1 Gbps primary }
  er-gw: { icon: azure:vpn-gateway, label: ExpressRoute gateway, in: snet-gw }
  vpn-gw: { icon: azure:vpn-gateway, label: VPN gateway, note: Site-to-site backup, in: snet-gw }
  fw: { icon: azure:firewall, label: Azure Firewall, note: Filters spoke traffic, in: snet-fw }
  bastion: { icon: azure:bastion, label: Azure Bastion, note: RDP and SSH to VMs, in: snet-bastion }
  aks: { icon: azure:aks, label: AKS cluster, note: Private API server, in: snet-aks }
  vms: { icon: azure:vm, label: Virtual machines, note: App servers x2, in: snet-vm }
  pe: { icon: azure:private-endpoint, label: Private endpoint, in: snet-pe }
  sql: { icon: azure:sql, label: Azure SQL Database, in: sub }
  dns: { icon: azure:dns-zones, label: Private DNS zone, note: Linked to every VNet, in: sub }
  logs: { icon: azure:log-analytics, label: Log Analytics, note: Firewall and NSG logs, in: sub }

# Network links carry traffic both ways, so they are drawn without arrowheads.
edges:
  - servers -- router
  - router === er: private peering
  - er === er-gw
  - router --- vpn-gw: IPsec tunnel
  - er-gw, vpn-gw -> fw
  - hub -- spoke-app: peering
  - hub -- spoke-data: peering
  - fw ..> logs: diagnostics
  - vms -> pe -> sql
  - pe ..> dns: A record
