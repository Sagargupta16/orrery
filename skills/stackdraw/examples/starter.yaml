# yaml-language-server: $schema=../references/diagram.schema.json
# Starter template: rename the nodes, keep the shape. Render with `stackdraw render diagram.yaml`.
title: Web app on AWS
subtitle: A container service behind a load balancer, with a database, a cache and file storage
direction: right

groups:
  aws: { type: aws:cloud }

nodes:
  users: { icon: aws:users, label: Users }
  alb: { icon: aws:alb, label: Application Load Balancer, in: aws }
  app: { icon: aws:fargate, label: Web service, note: ECS on Fargate, badge: x3, in: aws }
  db: { icon: aws:aurora, label: Orders database, note: Aurora PostgreSQL, in: aws }
  cache: { icon: aws:elasticache, label: Session cache, note: ElastiCache for Valkey, in: aws }
  files: { icon: aws:s3, label: Uploads, note: S3 bucket, in: aws }

edges:
  - users -> alb: HTTPS
  - alb -> app
  # Label all sibling edges or none: a labeled edge takes one extra column.
  - app -> db, cache, files
